name: Android Build & Deploy

on:
  push:
    tags:
      - 'production-*'    # production-1.0.0+1  → build AAB release
      - 'staging-*'       # staging-1.0.0+1     → build APK release
      - 'development-*'   # development-1.0.0+1 → build APK debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      # ── 4. Parse tag → flavor, version, build number ───────────────────────
      - name: Set environment from tag
        id: env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == production-* ]]; then
            echo "FLAVOR=production" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == staging-* ]]; then
            echo "FLAVOR=staging" >> $GITHUB_OUTPUT
          else
            echo "FLAVOR=development" >> $GITHUB_OUTPUT
          fi
          # e.g. staging-1.2.3+45 → VERSION=1.2.3, BUILD=45
          VERSION=$(echo "$TAG" | sed 's/^[a-z]*-//' | cut -d'+' -f1)
          BUILD=$(echo "$TAG" | cut -d'+' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT

      # ── 5. Inject sensitive files from Secrets ─────────────────────────────
      - name: Inject google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV }}"  | base64 --decode > android/app/src/development/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON_STAG }}" | base64 --decode > android/app/src/staging/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD }}" | base64 --decode > android/app/src/production/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── 6. Inject .env files ───────────────────────────────────────────────
      - name: Inject .env files
        run: |
          echo "${{ secrets.ENV_DEVELOPMENT }}" | base64 --decode > .env.development
          echo "${{ secrets.ENV_STAGING }}"     | base64 --decode > .env.staging
          echo "${{ secrets.ENV_PRODUCTION }}"  | base64 --decode > .env.production

      # ── 7. Install dependencies ────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 8. Badge launcher icons (dev=red, staging=orange, production=skip) ─
      - name: Generate flavor badge icons
        run: |
          sudo apt-get install -y imagemagick
          FLAVOR="${{ steps.env.outputs.FLAVOR }}"
          if [[ "$FLAVOR" == "production" ]]; then exit 0; fi

          LABEL="DEV"
          COLOR="#CC0000"
          if [[ "$FLAVOR" == "staging" ]]; then
            LABEL="STG"
            COLOR="#E65C00"
          fi

          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SRC="android/app/src/main/res/mipmap-${DENSITY}/ic_launcher.png"
            DST="android/app/src/${FLAVOR}/res/mipmap-${DENSITY}/ic_launcher.png"
            SIZE=$(identify -format "%w" "$SRC")
            BANNER_H=$((SIZE / 4))
            FONT_SIZE=$((BANNER_H * 7 / 10))
            convert "$SRC" \
              \( -size "${SIZE}x${BANNER_H}" xc:"${COLOR}" \
                 -fill white -gravity Center \
                 -font DejaVu-Sans-Bold -pointsize ${FONT_SIZE} \
                 -annotate 0 "${LABEL}" \) \
              -gravity South -composite "$DST"
          done

      # ── 9. Build ───────────────────────────────────────────────────────────
      - name: Build APK debug (development)
        if: startsWith(github.ref_name, 'development-')
        run: |
          flutter build apk \
            --debug \
            --flavor development \
            --build-name=${{ steps.env.outputs.VERSION }} \
            --build-number=${{ steps.env.outputs.BUILD }}

      - name: Build APK release (staging)
        if: startsWith(github.ref_name, 'staging-')
        run: |
          flutter build apk \
            --release \
            --flavor staging \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.env.outputs.VERSION }} \
            --build-number=${{ steps.env.outputs.BUILD }}

      - name: Build AAB release (production)
        if: startsWith(github.ref_name, 'production-')
        run: |
          flutter build appbundle \
            --release \
            --flavor production \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.env.outputs.VERSION }} \
            --build-number=${{ steps.env.outputs.BUILD }}

      # ── 10. Upload to Firebase App Distribution ────────────────────────────
      - name: Upload APK (development)
        if: startsWith(github.ref_name, 'development-')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DEV }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-development-debug.apk
          releaseNotes: "Tag: ${{ github.ref_name }}"

      - name: Upload APK (staging)
        if: startsWith(github.ref_name, 'staging-')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAG }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-staging-release.apk
          releaseNotes: "Tag: ${{ github.ref_name }}"

      - name: Upload AAB (production)
        if: startsWith(github.ref_name, 'production-')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/bundle/productionRelease/app-production-release.aab
          releaseNotes: "Tag: ${{ github.ref_name }}"
