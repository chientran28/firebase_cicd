name: Android Build & Deploy

on:
  push:
    tags:
      - 'production-*'    # production-1.0.0+1  → build AAB
      - 'development-*'   # development-1.0.0+1 → build APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v6

      # ── 2. Java ────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      # ── 4. Parse tag → flavor, version, build number ───────────────────────
      - name: Set environment from tag
        id: env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == production-* ]]; then
            echo "FLAVOR=production" >> $GITHUB_OUTPUT
          else
            echo "FLAVOR=development" >> $GITHUB_OUTPUT
          fi
          # development-1.2.3+45 → VERSION=1.2.3, BUILD=45
          VERSION=$(echo "$TAG" | sed 's/^[a-z]*-//' | cut -d'+' -f1)
          BUILD=$(echo "$TAG" | cut -d'+' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT

      # ── 5. Inject sensitive files from Secrets ─────────────────────────────
      - name: Inject google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── 6. Inject .env files ───────────────────────────────────────────────
      - name: Inject .env files
        run: |
          if [[ "${{ steps.env.outputs.FLAVOR }}" == "production" ]]; then
            echo "${{ secrets.ENV_PRODUCTION }}" | base64 --decode > .env.production
            echo "${{ secrets.ENV_DEVELOPMENT }}" | base64 --decode > .env.development
          else
            echo "${{ secrets.ENV_DEVELOPMENT }}" | base64 --decode > .env.development
            echo "${{ secrets.ENV_PRODUCTION }}" | base64 --decode > .env.production
          fi

      # ── 8. Install dependencies ────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 9. Build ───────────────────────────────────────────────────────────
      - name: Build APK (development)
        if: startsWith(github.ref_name, 'development-')
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.env.outputs.VERSION }} \
            --build-number=${{ steps.env.outputs.BUILD }}

      - name: Build AAB (production)
        if: startsWith(github.ref_name, 'production-')
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.env.outputs.VERSION }} \
            --build-number=${{ steps.env.outputs.BUILD }}

      # ── 10. Upload to Firebase App Distribution ────────────────────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: >-
            ${{ startsWith(github.ref_name, 'production-')
              && 'build/app/outputs/bundle/release/app-release.aab'
              || 'build/app/outputs/flutter-apk/app-release.apk' }}
          releaseNotes: "Tag: ${{ github.ref_name }}"
